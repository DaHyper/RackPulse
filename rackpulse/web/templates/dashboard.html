<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RackPulse — Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <div>
            <h1>RackPulse</h1>
            <p class="subtitle" id="header-subtitle">Loading…</p>
          </div>
        </div>
      </div>
      <nav class="header-nav">
        <a href="/" class="nav-link active">Dashboard</a>
        <a href="/config" class="nav-link">Configuration</a>
      </nav>
      <div class="header-right">
        <span class="live-badge" id="live-badge">
          <span class="dot"></span> Live · updates every <span id="poll-interval">60</span>s
        </span>
        <button class="btn btn-secondary" id="refresh-btn" type="button">
          ↻ Refresh
        </button>
      </div>
    </header>

    <main class="main">
      <div id="maintenance-banner" class="maintenance-banner" hidden></div>
      <div class="dashboard-tabs" role="tablist">
        <button class="tab-btn active" id="tab-racks" type="button" data-view="racks">Rack power</button>
        <button class="tab-btn" id="tab-devices" type="button" data-view="devices">Devices</button>
      </div>
      <div class="rack-grid" id="rack-grid">
        <p class="loading">Loading rack data…</p>
      </div>
      <div class="device-view" id="device-view" hidden></div>

      <section class="combined-view" id="combined-view" hidden>
        <h2>Combined view — all racks</h2>
        <p class="combined-summary" id="combined-summary"></p>
        <div class="combined-gauge">
          <div class="gauge-track" id="gauge-track">
            <div class="gauge-zone gauge-zone-ok"></div>
            <div class="gauge-zone gauge-zone-warn"></div>
            <div class="gauge-zone gauge-zone-critical"></div>
            <div class="gauge-marker" id="gauge-marker"></div>
            <div class="gauge-limit-label" id="gauge-limit-label"></div>
          </div>
          <div class="gauge-arrow" id="gauge-arrow">▼</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>RackPulse v{{ version }}</span>
      <span id="last-poll">Last poll: —</span>
    </footer>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
