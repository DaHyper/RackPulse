[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rackpulse"
version = "2.0.0"
description = "Multi-rack power and infrastructure monitoring"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pysnmp>=7.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]
alerts = []
everything = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
rackpulse = "rackpulse_console:main"

[tool.setuptools]
py-modules = ["rackpulse_console"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rackpulse*"]

[tool.setuptools.package-data]
"rackpulse.web" = ["templates/*", "static/**/*"]
